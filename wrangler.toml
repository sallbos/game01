# ============================================================
# SALEH GAMING — wrangler.toml
# Cloudflare Workers + Static Assets configuration
# Deploy: wrangler deploy
# Dev:    wrangler dev
# ============================================================

# ── Worker identity ──────────────────────────────────────────
name       = "saleh-gaming"
main       = "worker/index.js"
compatibility_date = "2024-09-23"

# Use the latest compatibility flags for best performance
compatibility_flags = ["nodejs_compat"]

# ── Workers Static Assets ────────────────────────────────────
# Serves all files in the project root as static assets.
# The Worker's env.ASSETS binding lets index.js handle routing.
[assets]
directory = "."
# Files/dirs to exclude from the asset bundle:
not_found_handling = "none"   # We handle 404 ourselves in the Worker

# ── Deployment environment: production ───────────────────────
[env.production]
name = "saleh-gaming"

# ── Deployment environment: preview (staging) ────────────────
[env.preview]
name = "saleh-gaming-preview"

# ── Build settings ───────────────────────────────────────────
# No build step needed — pure static + Worker
[build]
command = ""

# ── Cache rules (Workers KV not required — handled in Worker) ─
# Uncomment and add your KV namespace ID if you add KV later:
# [[kv_namespaces]]
# binding = "CACHE"
# id      = "YOUR_KV_NAMESPACE_ID"

# ── Observability ─────────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1

# ── Triggers: HTTP only (no Cron needed) ─────────────────────
[triggers]
crons = []
