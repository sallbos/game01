<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Survival</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
  }
  #wrap {
    position: relative;
    width: 100%;
    max-width: 800px;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
  }
  /* Mobile overlays */
  #mobileUI {
    display: none;
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  #joystickBase {
    position: absolute;
    left: 40px; bottom: 50px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(108,0,255,0.2);
    border: 3px solid rgba(108,0,255,0.6);
    pointer-events: all;
  }
  #btnFire {
    position: absolute;
    right: 30px; bottom: 50px;
    width: 75px; height: 75px;
    border-radius: 50%;
    background: rgba(255,50,50,0.5);
    border: 3px solid #ff4444;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    pointer-events: all;
    color: #fff;
  }
  #btnReload {
    position: absolute;
    right: 115px; bottom: 60px;
    width: 55px; height: 55px;
    border-radius: 50%;
    background: rgba(255,220,0,0.5);
    border: 3px solid #ffdd00;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: bold;
    pointer-events: all;
    color: #fff;
  }
  @media (max-width:700px), (pointer:coarse) {
    #mobileUI { display: block; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="500"></canvas>
  <div id="mobileUI">
    <div id="joystickBase"></div>
    <div id="btnFire">🔫</div>
    <div id="btnReload">R</div>
  </div>
</div>
<script>
'use strict';
// ─── CANVAS ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 800, H = 500;

// ─── UTILITY ────────────────────────────────────────────────────────────────
function rand(a,b){ return Math.random()*(b-a)+a; }
function randInt(a,b){ return Math.floor(rand(a,b+1)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp(v,mn,mx){ return Math.max(mn,Math.min(mx,v)); }
function dist(a,b){ const dx=a.x-b.x,dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
function normalize(dx,dy){ const d=Math.sqrt(dx*dx+dy*dy)||1; return {x:dx/d,y:dy/d}; }
function circleRect(cx,cy,cr,rx,ry,rw,rh){
  const nx=clamp(cx,rx,rx+rw), ny=clamp(cy,ry,ry+rh);
  return (cx-nx)*(cx-nx)+(cy-ny)*(cy-ny) < cr*cr;
}

// ─── PARTICLES ──────────────────────────────────────────────────────────────
const particles = [];
function spawn(x,y,color,n,spd,life,r=3){
  for(let i=0;i<n;i++){
    const ang=rand(0,Math.PI*2);
    const s=rand(spd*0.4,spd);
    particles.push({x,y,vx:Math.cos(ang)*s,vy:Math.sin(ang)*s,life,maxLife:life,color,r:rand(r*0.5,r)});
  }
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy;
    p.vx*=0.95; p.vy*=0.95;
    p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.save();
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// ─── INPUT ──────────────────────────────────────────────────────────────────
const keys = {};
let mouseX = W/2, mouseY = H/2;
let mouseDown = false;

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR') game.reload();
  if (e.code === 'Digit1') game.switchWeapon(0);
  if (e.code === 'Digit2') game.switchWeapon(1);
  if (e.code === 'Digit3') game.switchWeapon(2);
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = (e.clientX - r.left) * W / r.width;
  mouseY = (e.clientY - r.top)  * H / r.height;
});
canvas.addEventListener('mousedown', e => { mouseDown = true; });
canvas.addEventListener('mouseup',   e => { mouseDown = false; });

// Virtual joystick
let joystickActive = false, joystickX = 0, joystickY = 0;
let joystickOriginX = 0, joystickOriginY = 0;
const joyBase = document.getElementById('joystickBase');
const joyBaseRect = () => joyBase.getBoundingClientRect();

joyBase.addEventListener('touchstart', e => {
  e.preventDefault();
  joystickActive = true;
  const r = joyBaseRect();
  joystickOriginX = r.left + r.width/2;
  joystickOriginY = r.top  + r.height/2;
}, {passive:false});

document.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!joystickActive) return;
  const t = e.touches[0];
  const dx = t.clientX - joystickOriginX;
  const dy = t.clientY - joystickOriginY;
  const d  = Math.sqrt(dx*dx+dy*dy);
  const maxR = 50;
  joystickX = dx/Math.max(d,maxR)*Math.min(d,maxR)/maxR;
  joystickY = dy/Math.max(d,Math.min(d,maxR))*Math.min(d,maxR)/maxR;
}, {passive:false});

document.addEventListener('touchend', e => {
  joystickActive = false;
  joystickX = 0; joystickY = 0;
}, {passive:false});

// Right-side shoot on right half
let rightTouchX = W/2, rightTouchY = H/2, rightTouchFire = false;
const btnFire   = document.getElementById('btnFire');
const btnReload = document.getElementById('btnReload');
btnFire.addEventListener('touchstart',   e => { e.preventDefault(); rightTouchFire = true; }, {passive:false});
btnFire.addEventListener('touchend',     e => { e.preventDefault(); rightTouchFire = false; }, {passive:false});
btnReload.addEventListener('touchstart', e => { e.preventDefault(); game.reload(); }, {passive:false});

// ─── ARENA / WALLS ─────────────────────────────────────────────────────────
const ARENA = { x:20, y:20, w:W-40, h:H-40 };
const WALLS = [];
function generateWalls() {
  WALLS.length = 0;
  const positions = [
    {x:150,y:100,w:80,h:30},{x:350,y:80,w:30,h:80},
    {x:580,y:120,w:80,h:30},{x:200,y:280,w:30,h:90},
    {x:450,y:260,w:80,h:30},{x:620,y:300,w:30,h:80},
    {x:300,y:380,w:80,h:30},{x:500,y:400,w:30,h:60},
    {x:100,y:380,w:60,h:30},{x:680,y:200,w:30,h:70},
  ];
  WALLS.push(...positions);
}

// ─── GAME ───────────────────────────────────────────────────────────────────
const WEAPONS = [
  { name:'Pistol',      maxAmmo:8,  ammo:8,  damage:35, fireRate:18, autoFire:false, pellets:1, spread:0,   reloadTime:120 },
  { name:'Shotgun',     maxAmmo:3,  ammo:3,  damage:25, fireRate:40, autoFire:false, pellets:3, spread:0.25, reloadTime:150 },
  { name:'Machine Gun', maxAmmo:50, ammo:50, damage:15, fireRate:5,  autoFire:true,  pellets:1, spread:0.08, reloadTime:100 },
];

const game = {
  state: 'start',   // start | countdown | playing | gameover
  t: 0,
  score: 0,
  hiScore: parseInt(localStorage.getItem('zs_hs')||'0'),
  wave: 1,
  waveState: 'countdown',  // countdown | active | rest
  waveTimer: 0,
  enemiesLeft: 0,
  restTimer: 0,
  countdownTimer: 180,

  player: null,
  zombies: [],
  bullets: [],
  pickups: [],
  weaponIndex: 0,
  weapons: [],
  reloading: false,
  reloadTimer: 0,
  fireCooldown: 0,
  muzzleFlash: 0,

  shake: 0,
  damageFlash: 0,

  init() {
    generateWalls();
    this.score = 0;
    this.wave  = 1;
    this.waveState = 'countdown';
    this.waveTimer = 0;
    this.countdownTimer = 180;
    this.restTimer = 0;
    this.zombies = [];
    this.bullets = [];
    this.pickups = [];
    particles.length = 0;
    this.muzzleFlash = 0;
    this.shake = 0;
    this.damageFlash = 0;
    this.reloading = false;
    this.reloadTimer = 0;
    this.fireCooldown = 0;

    // Deep clone weapons
    this.weapons = WEAPONS.map(w => ({ ...w }));
    this.weaponIndex = 0;

    this.player = {
      x: W/2, y: H/2,
      r: 20,
      hp: 100, maxHp: 100,
      angle: 0,
      speed: 3,
      invincible: 0,
    };

    this.state = 'playing';
    this.startCountdown();
  },

  startCountdown() {
    this.waveState = 'countdown';
    this.countdownTimer = 180; // 3 seconds
  },

  spawnWave() {
    this.waveState = 'active';
    const count = this.wave * 3;
    const tanks  = Math.floor(this.wave / 5);
    this.enemiesLeft = count + tanks;

    for (let i = 0; i < count; i++) {
      this.spawnZombie(i < Math.floor(count * 0.4) ? 'runner' : 'walker');
    }
    for (let i = 0; i < tanks; i++) {
      this.spawnZombie('tank');
    }
  },

  spawnZombie(type) {
    // Spawn at arena edge
    const side = randInt(0,3);
    let x,y;
    if      (side===0) { x=rand(ARENA.x,ARENA.x+ARENA.w); y=ARENA.y+5; }
    else if (side===1) { x=ARENA.x+ARENA.w-5;             y=rand(ARENA.y,ARENA.y+ARENA.h); }
    else if (side===2) { x=rand(ARENA.x,ARENA.x+ARENA.w); y=ARENA.y+ARENA.h-5; }
    else               { x=ARENA.x+5;                     y=rand(ARENA.y,ARENA.y+ARENA.h); }

    const def = {
      walker: { hp:30, maxHp:30, spd:1.0, r:16, col:'#8b2500', dmg:10, score:10 },
      runner: { hp:15, maxHp:15, spd:2.5, r:12, col:'#cc3300', dmg:8,  score:10 },
      tank:   { hp:150,maxHp:150,spd:0.6, r:24, col:'#550000', dmg:25, score:50 },
    }[type];

    this.zombies.push({ ...def, type, x, y, dead:false, hitTimer:0, angle:0 });
  },

  reload() {
    if (this.reloading) return;
    const w = this.weapons[this.weaponIndex];
    if (w.ammo === w.maxAmmo) return;
    this.reloading = true;
    this.reloadTimer = w.reloadTime;
  },

  switchWeapon(idx) {
    if (idx < this.weapons.length) {
      if (this.wave >= 3 || idx === 0) {
        this.weaponIndex = idx;
        this.reloading = false;
      }
    }
  },

  update() {
    if (this.state !== 'playing') return;
    this.t++;

    this.updatePlayer();
    this.updateWave();
    this.updateZombies();
    this.updateBullets();
    this.updatePickups();
    updateParticles();

    if (this.muzzleFlash > 0) this.muzzleFlash--;
    if (this.shake > 0) this.shake--;
    if (this.damageFlash > 0) this.damageFlash--;
    if (this.fireCooldown > 0) this.fireCooldown--;

    if (this.reloading) {
      this.reloadTimer--;
      if (this.reloadTimer <= 0) {
        this.reloading = false;
        const w = this.weapons[this.weaponIndex];
        w.ammo = w.maxAmmo;
      }
    }

    // Unlock weapons
    if (this.wave >= 3 && this.weapons.length < 2) this.weapons.push({...WEAPONS[1]});
    if (this.wave >= 6 && this.weapons.length < 3) this.weapons.push({...WEAPONS[2]});
  },

  updateWave() {
    if (this.waveState === 'countdown') {
      this.countdownTimer--;
      if (this.countdownTimer <= 0) this.spawnWave();
    } else if (this.waveState === 'active') {
      if (this.enemiesLeft <= 0 && this.zombies.every(z => z.dead)) {
        this.waveState = 'rest';
        this.restTimer = 300; // 5 seconds
        this.score += this.wave * 50; // wave bonus
        // Heal
        this.player.hp = Math.min(this.player.maxHp, this.player.hp + 20);
        // Ammo drop
        this.pickups.push({ x:W/2, y:H/2, type:'ammo', r:14 });
      }
    } else if (this.waveState === 'rest') {
      this.restTimer--;
      if (this.restTimer <= 0) {
        this.wave++;
        this.startCountdown();
      }
    }
  },

  updatePlayer() {
    const p = this.player;
    const spd = p.speed;

    // Movement
    let mvx = 0, mvy = 0;
    if (keys['KeyW'] || keys['ArrowUp'])    mvy -= 1;
    if (keys['KeyS'] || keys['ArrowDown'])  mvy += 1;
    if (keys['KeyA'] || keys['ArrowLeft'])  mvx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) mvx += 1;
    if (joystickActive) { mvx = joystickX; mvy = joystickY; }

    const mag = Math.sqrt(mvx*mvx+mvy*mvy)||1;
    if (mvx!==0||mvy!==0) { mvx/=mag; mvy/=mag; }

    const nx = p.x + mvx*spd;
    const ny = p.y + mvy*spd;

    // Clamp to arena
    if (!this.collidesWithWalls(nx, p.y, p.r)) p.x = clamp(nx, ARENA.x+p.r, ARENA.x+ARENA.w-p.r);
    if (!this.collidesWithWalls(p.x, ny, p.r)) p.y = clamp(ny, ARENA.y+p.r, ARENA.y+ARENA.h-p.r);

    // Aim at mouse
    p.angle = Math.atan2(mouseY - p.y, mouseX - p.x);

    // Shoot
    const w = this.weapons[this.weaponIndex];
    const shouldFire = mouseDown || keys['Space'] || rightTouchFire;
    if (shouldFire && !this.reloading && w.ammo > 0 && this.fireCooldown <= 0) {
      if (w.autoFire || !keys['_prevFire']) {
        this.fireBullet();
        this.fireCooldown = w.fireRate;
        keys['_prevFire'] = true;
      }
    }
    if (!shouldFire) keys['_prevFire'] = false;

    if (p.invincible > 0) p.invincible--;
  },

  collidesWithWalls(x, y, r) {
    if (x-r < ARENA.x || x+r > ARENA.x+ARENA.w || y-r < ARENA.y || y+r > ARENA.y+ARENA.h) return true;
    for (const w of WALLS) {
      if (circleRect(x,y,r, w.x,w.y,w.w,w.h)) return true;
    }
    return false;
  },

  fireBullet() {
    const p = this.player;
    const w = this.weapons[this.weaponIndex];
    w.ammo--;
    this.muzzleFlash = 4;

    for (let i=0;i<w.pellets;i++) {
      const ang = p.angle + (Math.random()-0.5)*w.spread;
      this.bullets.push({
        x: p.x + Math.cos(p.angle)*25,
        y: p.y + Math.sin(p.angle)*25,
        vx: Math.cos(ang)*14,
        vy: Math.sin(ang)*14,
        damage: w.damage,
        life: 50,
        trail: [],
      });
    }

    if (w.ammo <= 0 && !this.reloading) this.reload();
  },

  updateBullets() {
    for (let i=this.bullets.length-1;i>=0;i--) {
      const b = this.bullets[i];
      b.trail.push({x:b.x, y:b.y});
      if (b.trail.length > 5) b.trail.shift();
      b.x += b.vx; b.y += b.vy;
      b.life--;

      // Wall collision
      let hit = false;
      if (b.x<ARENA.x||b.x>ARENA.x+ARENA.w||b.y<ARENA.y||b.y>ARENA.y+ARENA.h) hit=true;
      for (const w of WALLS) {
        if (b.x>w.x&&b.x<w.x+w.w&&b.y>w.y&&b.y<w.y+w.h) { hit=true; break; }
      }
      if (b.life<=0) hit=true;

      if (hit) { this.bullets.splice(i,1); continue; }

      // Zombie collision
      let bHit = false;
      for (const z of this.zombies) {
        if (z.dead) continue;
        if (dist(b, z) < z.r + 4) {
          z.hp -= b.damage;
          z.hitTimer = 10;
          spawn(b.x, b.y, '#cc0000', 8, 3, 18, 3); // blood
          if (z.hp <= 0) this.killZombie(z);
          bHit = true;
          break;
        }
      }
      if (bHit) { this.bullets.splice(i,1); continue; }
    }
  },

  killZombie(z) {
    z.dead = true;
    this.score += z.score;
    this.enemiesLeft--;

    if (z.type === 'tank') {
      spawn(z.x,z.y,'#ff6600',20,5,40,5);
      spawn(z.x,z.y,'#ff4400',20,4,35,4);
      this.shake = 20;
      // Always drop ammo
      this.pickups.push({ x:z.x, y:z.y, type:'ammo', r:12 });
    } else {
      // 30% chance ammo drop
      if (Math.random()<0.3) this.pickups.push({ x:z.x, y:z.y, type:'ammo', r:12 });
      spawn(z.x,z.y,'#880000',8,3,20,3);
    }
    // Weapon drops
    if (this.wave>=3 && Math.random()<0.08) this.pickups.push({x:z.x,y:z.y,type:'shotgun',r:14});
    if (this.wave>=6 && Math.random()<0.05) this.pickups.push({x:z.x,y:z.y,type:'machinegun',r:14});
  },

  updateZombies() {
    const p = this.player;
    for (const z of this.zombies) {
      if (z.dead) continue;
      if (z.hitTimer>0) z.hitTimer--;

      // Pathfind toward player (avoid walls)
      const dx = p.x-z.x, dy = p.y-z.y;
      const d  = Math.sqrt(dx*dx+dy*dy)||1;
      let nx = dx/d*z.spd, ny = dy/d*z.spd;

      // Try to avoid walls
      let moved = false;
      for (let ang=0; ang<=Math.PI; ang+=Math.PI/8) {
        for (const sign of [1,-1]) {
          const a = Math.atan2(dy,dx) + ang*sign;
          const tx = z.x+Math.cos(a)*z.spd;
          const ty = z.y+Math.sin(a)*z.spd;
          if (!this.collidesWithWalls(tx,ty,z.r)) {
            if (ang===0) { z.x=tx; z.y=ty; moved=true; break; }
            else { z.x=tx; z.y=ty; moved=true; break; }
          }
        }
        if (moved) break;
      }
      if (!moved) { z.x+=nx; z.y+=ny; }

      z.angle = Math.atan2(dy,dx);

      // Attack player
      if (p.invincible<=0 && dist(z,p) < z.r+p.r+2) {
        p.hp -= z.dmg * 0.03; // per frame
        p.invincible = 10;
        this.damageFlash = 15;
        if (p.hp <= 0) {
          p.hp = 0;
          this.gameOver();
        }
      }
    }
  },

  updatePickups() {
    const p = this.player;
    for (let i=this.pickups.length-1;i>=0;i--) {
      const pk = this.pickups[i];
      if (dist(pk,p) < pk.r+p.r) {
        if (pk.type==='ammo') {
          const w=this.weapons[this.weaponIndex];
          w.ammo=Math.min(w.maxAmmo, w.ammo+Math.ceil(w.maxAmmo/2));
          spawn(pk.x,pk.y,'#ffdd00',6,2,20,3);
        } else if (pk.type==='shotgun' && this.weapons.length>=2) {
          this.weapons[1].ammo=Math.min(this.weapons[1].maxAmmo, this.weapons[1].ammo+10);
          spawn(pk.x,pk.y,'#ff8800',6,2,20,3);
        } else if (pk.type==='machinegun' && this.weapons.length>=3) {
          this.weapons[2].ammo=Math.min(this.weapons[2].maxAmmo, this.weapons[2].ammo+30);
          spawn(pk.x,pk.y,'#00b4ff',6,2,20,3);
        }
        this.pickups.splice(i,1);
      }
    }
  },

  gameOver() {
    this.state = 'gameover';
    if (this.score > this.hiScore) {
      this.hiScore = this.score;
      localStorage.setItem('zs_hs', this.hiScore);
    }
  },

  // ─── DRAW ─────────────────────────────────────────────────────────────────
  draw() {
    let sx=0, sy=0;
    if (this.shake>0){ sx=(Math.random()-0.5)*4; sy=(Math.random()-0.5)*4; }
    ctx.save();
    ctx.translate(sx,sy);

    switch(this.state){
      case 'start':    this.drawStart();   break;
      case 'playing':  this.drawGame();    break;
      case 'gameover': this.drawGameOver();break;
    }
    ctx.restore();
  },

  drawFloor() {
    // Dark tile pattern
    const tileSize = 50;
    for (let tx=ARENA.x; tx<ARENA.x+ARENA.w; tx+=tileSize) {
      for (let ty=ARENA.y; ty<ARENA.y+ARENA.h; ty+=tileSize) {
        const dark = ((Math.floor(tx/tileSize)+Math.floor(ty/tileSize))%2===0);
        ctx.fillStyle = dark ? '#0e0e14' : '#111118';
        ctx.fillRect(tx,ty,tileSize,tileSize);
        // Subtle grid
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 1;
        ctx.strokeRect(tx,ty,tileSize,tileSize);
      }
    }
    // Border
    ctx.strokeStyle = '#6c00ff';
    ctx.lineWidth = 4;
    ctx.strokeRect(ARENA.x,ARENA.y,ARENA.w,ARENA.h);
    // Outer dark
    ctx.fillStyle = '#05050a';
    ctx.fillRect(0,0,W,ARENA.y);
    ctx.fillRect(0,ARENA.y+ARENA.h,W,H-(ARENA.y+ARENA.h));
    ctx.fillRect(0,ARENA.y,ARENA.x,ARENA.h);
    ctx.fillRect(ARENA.x+ARENA.w,ARENA.y,W-(ARENA.x+ARENA.w),ARENA.h);
  },

  drawWalls() {
    for (const w of WALLS) {
      // Shadow
      ctx.fillStyle = '#030308';
      ctx.fillRect(w.x+4,w.y+4,w.w,w.h);
      // Wall
      const gr=ctx.createLinearGradient(w.x,w.y,w.x,w.y+w.h);
      gr.addColorStop(0,'#444455');
      gr.addColorStop(1,'#222233');
      ctx.fillStyle=gr;
      ctx.fillRect(w.x,w.y,w.w,w.h);
      // Top highlight
      ctx.fillStyle='rgba(255,255,255,0.12)';
      ctx.fillRect(w.x,w.y,w.w,4);
      // Outline
      ctx.strokeStyle='#333344';
      ctx.lineWidth=1;
      ctx.strokeRect(w.x,w.y,w.w,w.h);
    }
  },

  drawPickups() {
    for (const pk of this.pickups) {
      ctx.save();
      ctx.translate(pk.x,pk.y);
      const pulse = Math.sin(this.t*0.1)*0.2+0.9;
      ctx.scale(pulse,pulse);
      if (pk.type==='ammo') {
        ctx.fillStyle='#ffdd00';
        ctx.shadowColor='#ffdd00';
        ctx.shadowBlur=10;
        ctx.beginPath();
        ctx.arc(0,0,pk.r,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle='#885500';
        ctx.font='bold 12px monospace';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillText('▪',0,0);
      } else if (pk.type==='shotgun') {
        ctx.fillStyle='#ff8800';
        ctx.shadowColor='#ff8800';
        ctx.shadowBlur=10;
        ctx.beginPath(); ctx.arc(0,0,pk.r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff';
        ctx.font='bold 11px monospace';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('SG',0,0);
      } else {
        ctx.fillStyle='#00b4ff';
        ctx.shadowColor='#00b4ff';
        ctx.shadowBlur=10;
        ctx.beginPath(); ctx.arc(0,0,pk.r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff';
        ctx.font='bold 11px monospace';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('MG',0,0);
      }
      ctx.restore();
    }
  },

  drawZombies() {
    for (const z of this.zombies) {
      if (z.dead) continue;
      ctx.save();
      ctx.translate(z.x,z.y);
      if (z.hitTimer>0) ctx.globalAlpha=0.6;

      // Shadow
      ctx.fillStyle='rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(0,z.r-2,z.r,z.r*0.4,0,0,Math.PI*2);
      ctx.fill();

      // Body
      const gr=ctx.createRadialGradient(0,0,0,0,0,z.r);
      gr.addColorStop(0,z.col+'cc');
      gr.addColorStop(1,z.col);
      ctx.fillStyle=gr;
      ctx.beginPath();
      ctx.arc(0,0,z.r,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle='rgba(255,100,0,0.5)';
      ctx.lineWidth=2;
      ctx.stroke();

      // Arms
      ctx.fillStyle=z.col;
      const armAng1=z.angle+0.6;
      const armAng2=z.angle-0.6;
      ctx.beginPath();
      ctx.ellipse(Math.cos(armAng1)*z.r*0.9, Math.sin(armAng1)*z.r*0.9, z.r*0.3, z.r*0.5, armAng1, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(Math.cos(armAng2)*z.r*0.9, Math.sin(armAng2)*z.r*0.9, z.r*0.3, z.r*0.5, armAng2, 0, Math.PI*2);
      ctx.fill();

      // Eyes (glow red)
      const ex1 = Math.cos(z.angle-0.3)*z.r*0.4;
      const ey1 = Math.sin(z.angle-0.3)*z.r*0.4;
      const ex2 = Math.cos(z.angle+0.3)*z.r*0.4;
      const ey2 = Math.sin(z.angle+0.3)*z.r*0.4;
      ctx.fillStyle='#ff2200';
      ctx.shadowColor='#ff2200'; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(ex1,ey1,3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex2,ey2,3,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;

      // HP bar (only if damaged)
      if (z.hp < z.maxHp) {
        ctx.fillStyle='#440000';
        ctx.fillRect(-z.r,-z.r-10,z.r*2,5);
        ctx.fillStyle='#ff4444';
        ctx.fillRect(-z.r,-z.r-10,z.r*2*(z.hp/z.maxHp),5);
      }

      ctx.restore();
    }
  },

  drawPlayer() {
    const p=this.player;
    ctx.save();
    ctx.translate(p.x,p.y);

    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(0,p.r-2,p.r,p.r*0.4,0,0,Math.PI*2);
    ctx.fill();

    // Body glow
    if (p.invincible%6<3) {
      ctx.shadowColor='#00b4ff';
      ctx.shadowBlur=15;
    }

    // Body circle
    const gr=ctx.createRadialGradient(-4,-4,2,0,0,p.r);
    gr.addColorStop(0,'#5577ff');
    gr.addColorStop(1,'#1133aa');
    ctx.fillStyle=gr;
    ctx.beginPath();
    ctx.arc(0,0,p.r,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#8899ff';
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.shadowBlur=0;

    // Direction indicator (white dot)
    ctx.fillStyle='rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.arc(Math.cos(p.angle)*12, Math.sin(p.angle)*12, 4, 0, Math.PI*2);
    ctx.fill();

    // Gun barrel
    ctx.save();
    ctx.rotate(p.angle);
    ctx.fillStyle='#334488';
    ctx.fillRect(14,-4,16,8);
    ctx.fillStyle='#4455aa';
    ctx.fillRect(14,-3,16,3);

    // Muzzle flash
    if (this.muzzleFlash>0) {
      ctx.fillStyle='#ffee55';
      ctx.shadowColor='#ffee55';
      ctx.shadowBlur=20;
      ctx.beginPath();
      ctx.arc(32,0,8,0,Math.PI*2);
      ctx.fill();
      ctx.shadowBlur=0;
    }
    ctx.restore();

    ctx.restore();
  },

  drawBullets() {
    for (const b of this.bullets) {
      // Trail
      if (b.trail.length>1) {
        ctx.save();
        ctx.strokeStyle='rgba(255,255,200,0.4)';
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(b.trail[0].x,b.trail[0].y);
        for (let i=1;i<b.trail.length;i++) ctx.lineTo(b.trail[i].x,b.trail[i].y);
        ctx.stroke();
        ctx.restore();
      }
      ctx.fillStyle='#ffffaa';
      ctx.beginPath();
      ctx.arc(b.x,b.y,3,0,Math.PI*2);
      ctx.fill();
    }
  },

  drawHUD() {
    const p=this.player;
    // Top bar
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,W,38);

    // HP bar
    const hpW=160, hpH=14;
    ctx.fillStyle='#111';
    ctx.fillRect(10,12,hpW,hpH);
    const hpColor = p.hp>60?'#44ff44':p.hp>30?'#ffaa00':'#ff4444';
    ctx.fillStyle=hpColor;
    ctx.fillRect(10,12,hpW*(p.hp/p.maxHp),hpH);
    ctx.strokeStyle='#333';
    ctx.lineWidth=1;
    ctx.strokeRect(10,12,hpW,hpH);
    ctx.fillStyle='#fff';
    ctx.font='10px monospace';
    ctx.textAlign='center';
    ctx.fillText(`HP: ${Math.ceil(p.hp)}/${p.maxHp}`, 10+hpW/2, 23);

    // Wave
    ctx.fillStyle='#6c00ff';
    ctx.font='bold 14px monospace';
    ctx.textAlign='center';
    let waveText='';
    if (this.waveState==='countdown') waveText=`Wave ${this.wave} — Get Ready! ${Math.ceil(this.countdownTimer/60)}s`;
    else if (this.waveState==='active') waveText=`Wave ${this.wave} — ${this.enemiesLeft} enemies`;
    else waveText=`Wave ${this.wave} complete! +20 HP  Next: ${Math.ceil(this.restTimer/60)}s`;
    ctx.fillText(waveText, W/2, 24);

    // Score
    ctx.fillStyle='#ffdd00';
    ctx.font='bold 14px monospace';
    ctx.textAlign='right';
    ctx.fillText(`SCORE: ${this.score}`, W-10, 24);

    // Weapon HUD
    const w=this.weapons[this.weaponIndex];
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(0,H-42,W,42);

    ctx.fillStyle='#00b4ff';
    ctx.font='bold 14px monospace';
    ctx.textAlign='left';
    ctx.fillText(`[${this.weaponIndex+1}] ${w.name}`, 10, H-20);

    ctx.fillStyle='#e8e8f0';
    ctx.font='14px monospace';
    ctx.textAlign='left';
    ctx.fillText(`Ammo: ${w.ammo} / ${w.maxAmmo}`, 180, H-20);

    // Reload bar
    if (this.reloading) {
      const prog = 1-(this.reloadTimer/w.reloadTime);
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillRect(10,H-38,160,10);
      ctx.fillStyle='#ffaa00';
      ctx.fillRect(10,H-38,160*prog,10);
      ctx.fillStyle='#fff';
      ctx.font='9px monospace';
      ctx.textAlign='center';
      ctx.fillText('RELOADING',90,H-31);
    }

    // Weapon slots
    for (let i=0;i<3;i++) {
      const wx=350+i*90;
      const avail=i<this.weapons.length;
      ctx.fillStyle=avail?(i===this.weaponIndex?'#6c00ff':'#333355'):'#1a1a22';
      ctx.beginPath();
      ctx.roundRect(wx,H-36,80,30,5);
      ctx.fill();
      ctx.strokeStyle=avail?(i===this.weaponIndex?'#9944ff':'#444466'):'#222233';
      ctx.lineWidth=1;
      ctx.stroke();
      ctx.fillStyle=avail?'#e8e8f0':'#333344';
      ctx.font='11px monospace';
      ctx.textAlign='center';
      const names=['Pistol','Shotgun','MG'];
      ctx.fillText(`[${i+1}] ${names[i]}`, wx+40, H-18);
    }

    // HiScore
    ctx.fillStyle='#555';
    ctx.font='12px monospace';
    ctx.textAlign='right';
    ctx.fillText(`HI: ${this.hiScore}`, W-10, H-20);

    // Damage vignette
    if (this.damageFlash>0) {
      const alpha=this.damageFlash/20*0.4;
      const vgr=ctx.createRadialGradient(W/2,H/2,100,W/2,H/2,350);
      vgr.addColorStop(0,'rgba(255,0,0,0)');
      vgr.addColorStop(1,`rgba(255,0,0,${alpha})`);
      ctx.fillStyle=vgr;
      ctx.fillRect(0,0,W,H);
    }

    ctx.textAlign='left';
  },

  drawGame() {
    ctx.fillStyle='#0a0a0f';
    ctx.fillRect(0,0,W,H);

    this.drawFloor();
    this.drawWalls();
    this.drawPickups();
    drawParticles();
    this.drawBullets();
    this.drawZombies();
    this.drawPlayer();
    this.drawHUD();
  },

  drawStart() {
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#0a0a0f');
    grad.addColorStop(1,'#1a0330');
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,W,H);

    // Animated title
    ctx.save();
    ctx.shadowColor='#6c00ff';
    ctx.shadowBlur=30+Math.sin(this.t*0.05)*10;
    ctx.fillStyle='#e8e8f0';
    ctx.font='bold 56px monospace';
    ctx.textAlign='center';
    ctx.fillText('ZOMBIE', W/2, H/2-80);
    ctx.fillStyle='#ff4444';
    ctx.shadowColor='#ff4444';
    ctx.fillText('SURVIVAL', W/2, H/2-10);
    ctx.restore();

    if (Math.floor(this.t/30)%2===0) {
      ctx.fillStyle='#00b4ff';
      ctx.font='bold 20px monospace';
      ctx.textAlign='center';
      ctx.fillText('CLICK / TAP / SPACE TO START', W/2, H/2+70);
    }
    ctx.fillStyle='#888';
    ctx.font='14px monospace';
    ctx.fillText(`Best Score: ${this.hiScore}`, W/2, H/2+110);
    ctx.fillStyle='#555';
    ctx.font='12px monospace';
    ctx.fillText('WASD: Move  Mouse: Aim  LMB/Space: Shoot  R: Reload  1/2/3: Weapons', W/2, H/2+145);
    ctx.textAlign='left';
  },

  drawGameOver() {
    ctx.fillStyle='rgba(0,0,0,0.85)';
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle='#ff4444';
    ctx.font='bold 56px monospace';
    ctx.textAlign='center';
    ctx.shadowColor='#ff0000';
    ctx.shadowBlur=30;
    ctx.fillText('YOU DIED', W/2, H/2-100);
    ctx.shadowBlur=0;

    ctx.fillStyle='#e8e8f0';
    ctx.font='22px monospace';
    ctx.fillText(`Wave Reached: ${this.wave}`, W/2, H/2-45);
    ctx.fillText(`Final Score: ${this.score}`, W/2, H/2-10);
    if (this.score>=this.hiScore && this.score>0) {
      ctx.fillStyle='#ffdd00';
      ctx.font='bold 20px monospace';
      ctx.fillText('⭐ NEW HIGH SCORE! ⭐', W/2, H/2+30);
    }
    ctx.fillStyle='#aaa';
    ctx.font='18px monospace';
    ctx.fillText(`High Score: ${this.hiScore}`, W/2, H/2+60);

    // Restart button
    ctx.fillStyle='#6c00ff';
    ctx.beginPath(); ctx.roundRect(W/2-90,H/2+90,180,44,8); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='bold 18px monospace';
    ctx.fillText('PLAY AGAIN', W/2, H/2+118);
    ctx.textAlign='left';
  },

  handleClick(mx,my) {
    if (this.state==='start') { this.init(); return; }
    if (this.state==='gameover') {
      if (mx>W/2-90&&mx<W/2+90&&my>H/2+90&&my<H/2+134) this.init();
    }
  },
};

// Canvas click
canvas.addEventListener('click', e => {
  const r=canvas.getBoundingClientRect();
  const mx=(e.clientX-r.left)*W/r.width;
  const my=(e.clientY-r.top)*H/r.height;
  game.handleClick(mx,my);
  if (game.state==='playing') {
    mouseX=mx; mouseY=my;
  }
});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  const t=e.changedTouches[0];
  const mx=(t.clientX-r.left)*W/r.width;
  const my=(t.clientY-r.top)*H/r.height;
  game.handleClick(mx,my);
},{passive:false});

document.addEventListener('keydown', e => {
  if (e.code==='Space' && (game.state==='start'||game.state==='gameover')) game.init();
});

// ─── MAIN LOOP ──────────────────────────────────────────────────────────────
function loop() {
  ctx.clearRect(0,0,W,H);
  game.update();
  game.draw();
  game.t++;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
