<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Galaxy Attack</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; }
  #wrap { position:relative; }
  canvas { display:block; image-rendering:pixelated; }
  #mobileControls { display:none; position:absolute; bottom:0; left:0; width:100%; height:120px; pointer-events:none; }
  @media (hover:none) { #mobileControls { display:flex; } }
  #shootBtn { position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    width:70px; height:70px; border-radius:50%; background:#6c00ff88; border:2px solid #6c00ff;
    color:#fff; font-size:22px; cursor:pointer; pointer-events:all; user-select:none;
    display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="480" height="640"></canvas>
  <div id="mobileControls">
    <div id="shootBtn">🔫</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
//  GALAXY ATTACK - Full Game
// ═══════════════════════════════════════
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 480, H = 640;

// Scale to viewport
function scaleCanvas() {
  const wrap = document.getElementById('wrap');
  const sx = window.innerWidth / W;
  const sy = window.innerHeight / H;
  const s = Math.min(sx, sy, 1.6);
  wrap.style.transform = `scale(${s})`;
  wrap.style.transformOrigin = 'center center';
}
scaleCanvas();
window.addEventListener('resize', scaleCanvas);

// ══ STARS ══
const STARS = Array.from({length:200}, () => ({
  x: Math.random()*W, y: Math.random()*H,
  r: 0.5+Math.random()*1.5, speed: 0.1+Math.random()*0.3,
  base: 0.3+Math.random()*0.7, alpha: Math.random(),
  da: (Math.random()-0.5)*0.02,
}));

// ══ NEBULA ══
const NEBULAE = [
  {x:120,y:180,r:160,c1:'#6c00ff11',c2:'transparent'},
  {x:380,y:400,r:200,c1:'#00b4ff0d',c2:'transparent'},
  {x:240,y:500,r:120,c1:'#9900ff0a',c2:'transparent'},
];

// ══ PLANETS ══
const PLANETS = [
  {x:380,y:120,r:35,color:'#8866aa',ring:true,dy:0.03},
  {x:60,y:420,r:22,color:'#446688',ring:false,dy:0.05},
];
let planetY = [0,0];

// ══ GAME STATE ══
let GS = {};

function initGame() {
  GS = {
    state: 'title', // title, countdown, playing, stagecomplete, gameover, bossdefeated
    score: 0,
    hiScore: parseInt(localStorage.getItem('ga_hs')||'0'),
    lives: 3,
    multiplier: 1,
    killStreak: 0,
    stage: 1,
    stagePhase: 0, // 0=scouts, 1=interceptors, 2=cruisers, 3=boss
    player: initPlayer(),
    bullets: [],
    enemyBullets: [],
    enemies: [],
    powerups: [],
    particles: [],
    explosions: [],
    floats: [],
    boss: null,
    bossHp: 0, bossMaxHp: 0, bossPhase: 0,
    countdownTimer: 3,
    stageTimer: 0,
    shotType: 'single', // single, double, triple
    shotTimer: 0,
    shieldActive: false,
    shieldHits: 0,
    speedBoost: false, speedTimer: 0,
    engineParticles: [],
    chargeLevel: 0, chargeActive: false,
    lastTime: 0,
    frameCount: 0,
    flashTimer: 0,
    bossDeathTimer: 0,
    missionCompleteTimer: 0,
    powerupTimers: {},
  };
}

function initPlayer() {
  return { x: W/2, y: H-100, tx: W/2, ty: H-100, hp: 3, invincible: 0, shootCooldown: 0, dead: false };
}

// ══ KEYS ══
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code==='Space') e.preventDefault();
  if (GS.state==='title' && (e.code==='Space'||e.code==='Enter')) startMission();
  if (GS.state==='gameover' && e.code==='Enter') { initGame(); GS.state='title'; }
  if (GS.state==='bossdefeated' && e.code==='Enter') nextStage();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ══ TOUCH ══
let touchLeft=false, touchRight=false, touchShoot=false, touchHoldStart=0;
c.addEventListener('touchstart', e => {
  e.preventDefault();
  Array.from(e.touches).forEach(t => {
    const x = t.clientX / (c.getBoundingClientRect().width/W);
    if (GS.state==='title'||GS.state==='gameover'||GS.state==='bossdefeated') { startMission(); return; }
    if (x < W*0.33) touchLeft=true;
    else if (x > W*0.67) touchRight=true;
    else { touchShoot=true; touchHoldStart=Date.now(); }
  });
}, {passive:false});
c.addEventListener('touchend', e => {
  touchLeft=false; touchRight=false;
  if (touchShoot) {
    const held = Date.now()-touchHoldStart;
    if (held > 1500 && GS.chargeLevel >= 1) releaseCharge();
    touchShoot=false;
  }
});
document.getElementById('shootBtn').addEventListener('touchstart', e => {
  e.preventDefault(); touchShoot=true; touchHoldStart=Date.now();
},{passive:false});
document.getElementById('shootBtn').addEventListener('touchend', e => {
  e.preventDefault();
  const held=Date.now()-touchHoldStart;
  if(held>1500&&GS.chargeLevel>=1) releaseCharge();
  touchShoot=false;
});

function startMission() {
  if (GS.state==='title') {
    GS.state='countdown';
    GS.countdownTimer=3;
    spawnStage();
  }
}

function nextStage() {
  GS.stage++;
  GS.stagePhase=0;
  GS.state='countdown';
  GS.countdownTimer=3;
  spawnStage();
}

// ══ STAGE SPAWNING ══
function spawnStage() {
  GS.enemies = [];
  GS.boss = null;
  GS.stagePhase = 0;
  spawnScouts();
}

function spawnScouts() {
  // 10 small ships in V-formation
  const cx = W/2;
  for (let i = 0; i < 10; i++) {
    const side = i % 2 === 0 ? 1 : -1;
    const row = Math.floor(i/2);
    GS.enemies.push({
      type:'scout', x: cx + side*(row+1)*35, y: -50 - row*40,
      tx: cx + side*(row+1)*35, ty: 100+row*35,
      hp:20, maxHp:20, spd:2, state:'enter', // enter->hover->dive
      hoverTime:2+row*0.3, shootCooldown:999, diveTarget:null,
      vx:0, vy:3, angle:Math.PI, reward:10,
      enterDone:false, diveStart:false,
    });
  }
}

function spawnInterceptors() {
  // 2 rows of 6 from sides
  for (let row=0; row<2; row++) {
    for (let col=0; col<6; col++) {
      const fromLeft = row===0;
      GS.enemies.push({
        type:'interceptor', 
        x: fromLeft ? -50 : W+50, 
        y: 160+row*80,
        tx: 60 + col*65, ty: 160+row*80,
        hp:40, maxHp:40, spd:3, state:'enter',
        shootCooldown:1.5+Math.random(), shootRate:2.5,
        inPosition:false, reward:25,
        vx: fromLeft ? 4:-4, vy:0,
      });
    }
  }
}

function spawnCruisers() {
  for (let i=0;i<3;i++) {
    GS.enemies.push({
      type:'cruiser', x:80+i*160, y:-80,
      tx:80+i*160, ty:120+i*40,
      hp:150, maxHp:150, spd:1, state:'enter',
      shootCooldown:2+i*0.5, reward:100,
      vx:0, vy:1.2, inPosition:false,
    });
  }
}

function spawnBoss() {
  const scale = 1 + (GS.stage-1)*0.3;
  GS.boss = {
    x:W/2, y:-120, tx:W/2, ty:100,
    hp: Math.round(2000*scale), maxHp: Math.round(2000*scale),
    phase:1, spd:1.5, state:'enter',
    spiralTimer:0, missileTimer:0, laserTimer:0, laserActive:false, laserX:0, laserAngle:0,
    moveTimer:0, moveTarget:W/2,
    enraged:false,
  };
  GS.bossHp = GS.boss.hp;
  GS.bossMaxHp = GS.boss.maxHp;
}

// ══ MAIN LOOP ══
let lastTS = 0;
function loop(ts) {
  const dt = Math.min((ts-lastTS)/1000, 0.05);
  lastTS = ts;
  GS.frameCount++;
  updateStars(dt);
  updatePlanets(dt);
  if (GS.state==='playing') update(dt);
  else if (GS.state==='countdown') updateCountdown(dt);
  draw();
  requestAnimationFrame(loop);
}

function updateCountdown(dt) {
  GS.countdownTimer -= dt;
  if (GS.countdownTimer <= 0) GS.state='playing';
}

function updateStars(dt) {
  STARS.forEach(s => {
    s.y += s.speed; if(s.y>H) s.y=-2;
    s.alpha += s.da;
    if(s.alpha>s.base||s.alpha<0.1) s.da*=-1;
    s.alpha=Math.max(0.1,Math.min(s.base,s.alpha));
  });
}
function updatePlanets(dt) {
  planetY[0]+=PLANETS[0].dy; planetY[1]+=PLANETS[1].dy;
}

function update(dt) {
  const p = GS.player;
  if (p.dead) return;
  
  updatePlayer(dt);
  updateBullets(dt);
  updateEnemies(dt);
  updateBoss(dt);
  updatePowerups(dt);
  updateParticles(dt);
  updateEnemyBullets(dt);
  updateEngineParticles(dt);
  checkCollisions();
  checkStageProgress();
  updateTimers(dt);
  
  if(GS.flashTimer>0) GS.flashTimer-=dt;
}

function updateTimers(dt) {
  if(GS.shotTimer>0){GS.shotTimer-=dt;if(GS.shotTimer<=0)GS.shotType='single';}
  if(GS.speedTimer>0){GS.speedTimer-=dt;if(GS.speedTimer<=0)GS.speedBoost=false;}
  if(GS.chargeActive){GS.chargeLevel=Math.min(1,(GS.chargeLevel||0)+dt/1.5);}
  if(GS.bossDeathTimer>0) GS.bossDeathTimer-=dt;
  if(GS.missionCompleteTimer>0){
    GS.missionCompleteTimer-=dt;
    if(GS.missionCompleteTimer<=0&&GS.state==='stagecomplete') GS.state='bossdefeated';
  }
}

function updatePlayer(dt) {
  const p = GS.player;
  const spd = (GS.speedBoost?300:200)*dt;
  
  if(keys['ArrowLeft']||keys['KeyA']||touchLeft) p.tx = Math.max(20, p.tx-spd);
  if(keys['ArrowRight']||keys['KeyD']||touchRight) p.tx = Math.min(W-20, p.tx+spd);
  
  // Smooth easing
  p.x += (p.tx-p.x)*0.15;
  p.y += (p.ty-p.y)*0.1;
  
  // Shoot
  p.shootCooldown -= dt;
  const fireRate = GS.shotType==='single'?0.3:GS.shotType==='double'?0.25:0.2;
  
  if(keys['Space']||touchShoot) {
    if(!GS.chargeActive) GS.chargeActive=true;
    if(p.shootCooldown<=0 && !keys['Space'] && !touchShoot) {} // handled below
    if(p.shootCooldown<=0 && !(keys['Space']&&GS.chargeLevel>0)) {
      shootPlayer();
      p.shootCooldown = fireRate;
    }
  } else {
    if(GS.chargeActive && GS.chargeLevel>=1) releaseCharge();
    GS.chargeActive=false; GS.chargeLevel=0;
    if(p.shootCooldown<=0) { shootPlayer(); p.shootCooldown=fireRate; }
  }

  // Engine particles
  if(Math.random()<0.4) {
    GS.engineParticles.push({
      x:p.x+(Math.random()-0.5)*12, y:p.y+22,
      vx:(Math.random()-0.5)*1.5, vy:2+Math.random()*3,
      life:0.4, color:`hsl(${200+Math.random()*40},100%,70%)`, r:2+Math.random()*2,
    });
  }

  if(p.invincible>0) p.invincible-=dt;
}

function shootPlayer() {
  const p = GS.player;
  if(GS.shotType==='single') {
    GS.bullets.push({x:p.x,y:p.y-20,vx:0,vy:-10,dmg:15,r:3,color:'#00ffff',glow:true});
  } else if(GS.shotType==='double') {
    GS.bullets.push({x:p.x-10,y:p.y-15,vx:0,vy:-10,dmg:12,r:3,color:'#00ffff',glow:true});
    GS.bullets.push({x:p.x+10,y:p.y-15,vx:0,vy:-10,dmg:12,r:3,color:'#00ffff',glow:true});
  } else { // triple
    GS.bullets.push({x:p.x-14,y:p.y-10,vx:-1.5,vy:-9.5,dmg:10,r:3,color:'#88ffff',glow:true});
    GS.bullets.push({x:p.x,y:p.y-20,vx:0,vy:-10,dmg:10,r:3,color:'#00ffff',glow:true});
    GS.bullets.push({x:p.x+14,y:p.y-10,vx:1.5,vy:-9.5,dmg:10,r:3,color:'#88ffff',glow:true});
  }
}

function releaseCharge() {
  const p=GS.player;
  GS.bullets.push({x:p.x,y:p.y-25,vx:0,vy:-7,dmg:80,r:16,color:'#ff88ff',glow:true,charge:true,pulse:0});
  GS.chargeLevel=0; GS.chargeActive=false;
}

function updateBullets(dt) {
  GS.bullets.forEach(b => {
    b.x+=b.vx*60*dt; b.y+=b.vy*60*dt;
    if(b.charge) b.pulse=(b.pulse||0)+dt*5;
  });
  GS.bullets = GS.bullets.filter(b => b.y>-20&&b.y<H+20&&b.x>-20&&b.x<W+20&&!b.dead);
}

function updateEnemyBullets(dt) {
  GS.enemyBullets.forEach(b => {
    b.x+=b.vx*60*dt; b.y+=b.vy*60*dt;
    if(b.homing&&b.homingTime>0) {
      b.homingTime-=dt;
      const p=GS.player;
      const dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy);
      if(d>0){b.vx+=dx/d*0.05;b.vy+=dy/d*0.05;}
      const spd=Math.hypot(b.vx,b.vy);
      if(spd>5){b.vx=b.vx/spd*5;b.vy=b.vy/spd*5;}
    }
  });
  GS.enemyBullets=GS.enemyBullets.filter(b=>b.y<H+30&&!b.dead&&b.y>-30&&b.x>-30&&b.x<W+30);
}

function updateEnemies(dt) {
  GS.enemies.forEach(e => {
    if(e.dead) return;
    
    if(e.type==='scout') {
      if(!e.enterDone) {
        e.y+=e.vy*60*dt;
        if(e.y>=e.ty){e.y=e.ty;e.enterDone=true;e.hoverTimer=e.hoverTime;}
      } else if(!e.diveStart) {
        e.hoverTimer-=dt;
        // Slight bob
        e.x+=Math.sin(GS.frameCount*0.08+e.tx)*0.5;
        if(e.hoverTimer<=0){e.diveStart=true;e.diveVy=5;}
      } else {
        e.y+=e.diveVy*60*dt; e.diveVy+=0.02;
        e.x+=(GS.player.x-e.x)*0.01;
        if(e.y>H+30) e.dead=true;
      }
    } else if(e.type==='interceptor') {
      if(!e.inPosition){
        e.x+=(e.tx-e.x)*0.08; e.y+=(e.ty-e.y)*0.08;
        if(Math.abs(e.x-e.tx)<3&&Math.abs(e.y-e.ty)<3){e.inPosition=true;}
      } else {
        e.x+=Math.sin(GS.frameCount*0.03+e.tx*0.1)*0.8;
        e.shootCooldown-=dt;
        if(e.shootCooldown<=0){
          e.shootCooldown=e.shootRate;
          shootInterceptor(e);
        }
      }
    } else if(e.type==='cruiser') {
      if(!e.inPosition){
        e.x+=(e.tx-e.x)*0.05; e.y+=(e.ty-e.y)*0.05;
        if(Math.abs(e.y-e.ty)<3) e.inPosition=true;
      } else {
        e.x+=Math.sin(GS.frameCount*0.02+e.tx*0.05)*0.5;
        e.shootCooldown-=dt;
        if(e.shootCooldown<=0){
          e.shootCooldown=2.5;
          shootCruiser(e);
        }
      }
    }
  });
  GS.enemies=GS.enemies.filter(e=>!e.dead);
}

function shootInterceptor(e) {
  // 3-spread
  for(let i=-1;i<=1;i++) {
    const ang=Math.PI/2+i*0.3;
    GS.enemyBullets.push({x:e.x,y:e.y+15,vx:Math.cos(ang-Math.PI/2)*2,vy:Math.sin(ang-Math.PI/2)*2+2,r:4,color:'#ff8800',dmg:1});
  }
}
function shootCruiser(e) {
  const p=GS.player;
  const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
  GS.enemyBullets.push({x:e.x,y:e.y+30,vx:dx/d*2.5,vy:dy/d*2.5,r:5,color:'#ff44ff',dmg:1});
}

function updateBoss(dt) {
  const boss=GS.boss;
  if(!boss||boss.dead) return;
  
  // Enter
  if(boss.state==='enter'){
    boss.y+=(boss.ty-boss.y)*0.03;
    if(boss.y>=boss.ty-2) boss.state='fight';
    return;
  }
  
  // Determine phase
  const hpPct=boss.hp/boss.maxHp;
  if(hpPct<0.3&&boss.phase<3){boss.phase=3;boss.enraged=true;triggerBossPhase(3);}
  else if(hpPct<0.6&&boss.phase<2){boss.phase=2;triggerBossPhase(2);}
  
  // Movement
  boss.moveTimer-=dt;
  if(boss.moveTimer<=0){boss.moveTarget=60+Math.random()*(W-120);boss.moveTimer=2+Math.random()*2;}
  boss.x+=(boss.moveTarget-boss.x)*0.015;
  
  // Spiral bullets
  const spiralRate=boss.enraged?1.5:3;
  boss.spiralTimer-=dt;
  if(boss.spiralTimer<=0){
    boss.spiralTimer=spiralRate;
    shootBossSpiral(boss);
  }
  
  // Phase 2: homing missiles
  if(boss.phase>=2){
    boss.missileTimer-=dt;
    if(boss.missileTimer<=0){
      boss.missileTimer=boss.enraged?2:4;
      shootBossMissile(boss);
    }
  }
  
  // Phase 3: laser sweep
  if(boss.phase>=3){
    boss.laserTimer-=dt;
    if(boss.laserTimer<=0){
      boss.laserTimer=4;
      boss.laserActive=true;
      boss.laserAngle=-0.5;
      setTimeout(()=>boss.laserActive=false,2000);
    }
    if(boss.laserActive){
      boss.laserAngle+=dt*1.0;
      // Check if laser hits player
      const p=GS.player;
      const lx=boss.x+Math.cos(Math.PI/2+boss.laserAngle)*1000;
      const ly=boss.y+Math.sin(Math.PI/2+boss.laserAngle)*1000;
      // Simple line-point check
      const dx=lx-boss.x,dy=ly-boss.y;
      const d=Math.hypot(dx,dy);
      const t=((p.x-boss.x)*dx+(p.y-boss.y)*dy)/(d*d);
      if(t>0&&t<1){
        const cx=boss.x+t*dx,cy=boss.y+t*dy;
        if(Math.hypot(cx-p.x,cy-p.y)<20) hitPlayer();
      }
    }
  }
}

function triggerBossPhase(ph) {
  spawnBossPhaseExplosion();
}
function shootBossSpiral(boss) {
  const n=8;
  const baseAng=(GS.frameCount*0.1)%(Math.PI*2);
  for(let i=0;i<n;i++){
    const ang=baseAng+(Math.PI*2/n)*i;
    GS.enemyBullets.push({x:boss.x,y:boss.y+60,vx:Math.cos(ang)*2.5,vy:Math.sin(ang)*2.5,r:5,color:'#ff44ff',dmg:1});
  }
}
function shootBossMissile(boss) {
  GS.enemyBullets.push({x:boss.x+(Math.random()-0.5)*100,y:boss.y+60,vx:(Math.random()-0.5)*2,vy:1.5,r:7,color:'#ff8800',dmg:1,homing:true,homingTime:4});
}

function spawnBossPhaseExplosion() {
  for(let i=0;i<20;i++){
    setTimeout(()=>{
      if(!GS.boss) return;
      spawnExplosionAt(GS.boss.x+(Math.random()-0.5)*200, GS.boss.y+(Math.random()-0.5)*100,'#aa44ff',15);
    },i*100);
  }
  GS.flashTimer=0.3;
}

function updatePowerups(dt) {
  GS.powerups.forEach(pu => { pu.y+=pu.vy*60*dt; pu.angle=(pu.angle||0)+dt*2; });
  GS.powerups=GS.powerups.filter(p=>p.y<H+20&&!p.collected);
}

function updateParticles(dt) {
  GS.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life-=dt*2;p.r=Math.max(0,p.r-dt*3);});
  GS.particles=GS.particles.filter(p=>p.life>0&&p.r>0);
  GS.engineParticles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=dt*3;});
  GS.engineParticles=GS.engineParticles.filter(p=>p.life>0);
  GS.floats.forEach(f=>{f.y-=1;f.life-=dt*1.5;});
  GS.floats=GS.floats.filter(f=>f.life>0);
}

function updateEngineParticles(dt) {} // handled in updateParticles

function checkCollisions() {
  const p=GS.player;
  if(p.invincible>0) return;
  
  // Enemy bullets vs player
  GS.enemyBullets.forEach(b=>{
    if(b.dead) return;
    if(Math.hypot(b.x-p.x,b.y-p.y)<18){
      b.dead=true;
      hitPlayer();
    }
  });
  
  // Enemy vs player (collision)
  GS.enemies.forEach(e=>{
    if(e.dead) return;
    if(Math.hypot(e.x-p.x,e.y-p.y)<20){ hitPlayer(); e.dead=true; }
  });
  
  // Player bullets vs enemies
  GS.bullets.forEach(b=>{
    if(b.dead) return;
    GS.enemies.forEach(e=>{
      if(e.dead||b.dead) return;
      const hitR=e.type==='cruiser'?35:e.type==='interceptor'?15:12;
      if(Math.hypot(b.x-e.x,b.y-e.y)<hitR+(b.charge?b.r:5)){
        e.hp-=b.dmg;
        if(!b.charge) b.dead=true;
        spawnHitSpark(b.x,b.y);
        if(e.hp<=0){
          killEnemy(e);
          if(!b.charge) b.dead=true;
        }
      }
    });
    // vs Boss
    if(GS.boss&&!GS.boss.dead){
      if(Math.hypot(b.x-GS.boss.x,b.y-GS.boss.y)<90+(b.charge?b.r:0)){
        GS.boss.hp-=b.dmg;
        if(!b.charge) b.dead=true;
        spawnHitSpark(b.x,b.y);
        if(GS.boss.hp<=0) killBoss();
      }
    }
  });
  
  // Player vs powerups
  GS.powerups.forEach(pu=>{
    if(pu.collected) return;
    if(Math.hypot(pu.x-p.x,pu.y-p.y)<28){ collectPowerup(pu); }
  });
}

function hitPlayer() {
  const p=GS.player;
  if(p.invincible>0) return;
  if(GS.shieldActive){
    GS.shieldActive=false;
    spawnExplosionAt(p.x,p.y,'#4488ff',12);
    GS.flashTimer=0.1;
    return;
  }
  spawnExplosionAt(p.x,p.y,'#ffffff',16);
  GS.flashTimer=0.15;
  GS.lives--;
  GS.multiplier=1; GS.killStreak=0;
  p.invincible=2;
  if(GS.lives<=0) gameOver();
}

function killEnemy(e) {
  if(e.dead) return;
  e.dead=true;
  const pts=e.type==='scout'?10:e.type==='interceptor'?25:100;
  const gained=pts*GS.multiplier;
  GS.score+=gained;
  GS.floats.push({x:e.x,y:e.y,text:`+${gained}×${GS.multiplier}`,color:'#ffd700',life:1.5});
  spawnExplosionAt(e.x,e.y,e.type==='cruiser'?'#aa44ff':'#ff6600',12);
  if(Math.random()<0.25) dropPowerup(e.x,e.y);
  GS.killStreak++;
  if(GS.killStreak%10===0){GS.multiplier=Math.min(8,GS.multiplier+1);}
  updateHiScore();
}

function killBoss() {
  if(!GS.boss||GS.boss.dead) return;
  GS.boss.dead=true;
  GS.score+=1000*GS.multiplier;
  GS.floats.push({x:GS.boss.x,y:GS.boss.y,text:`BOSS! +${1000*GS.multiplier}`,color:'#ff88ff',life:3});
  // Multi-explosion sequence
  for(let i=0;i<8;i++){
    setTimeout(()=>{
      if(GS.boss) spawnExplosionAt(GS.boss.x+(Math.random()-0.5)*180,GS.boss.y+(Math.random()-0.5)*80,'#ff6600',18);
      GS.flashTimer=0.15;
    },i*250);
  }
  setTimeout(()=>{ GS.state='stagecomplete'; GS.missionCompleteTimer=3; },2500);
  updateHiScore();
}

function updateHiScore() {
  if(GS.score>GS.hiScore){GS.hiScore=GS.score;localStorage.setItem('ga_hs',GS.score);}
}

function dropPowerup(x,y) {
  const types=['double','triple','shield','life','speed'];
  const icons=['⚡','⭐','🛡','❤','💫'];
  const colors=['#4488ff','#ffee00','#44ff88','#ff88aa','#00ffff'];
  const t=Math.floor(Math.random()*types.length);
  GS.powerups.push({x,y,type:types[t],icon:icons[t],color:colors[t],vy:0.5,angle:0,collected:false});
}

function collectPowerup(pu) {
  pu.collected=true;
  GS.floats.push({x:pu.x,y:pu.y,text:pu.icon+' '+pu.type.toUpperCase(),color:pu.color,life:2});
  switch(pu.type){
    case 'double': GS.shotType='double'; GS.shotTimer=15; break;
    case 'triple': GS.shotType='triple'; GS.shotTimer=10; break;
    case 'shield': GS.shieldActive=true; break;
    case 'life': GS.lives=Math.min(5,GS.lives+1); break;
    case 'speed': GS.speedBoost=true; GS.speedTimer=10; break;
  }
}

function checkStageProgress() {
  if(GS.state!=='playing') return;
  const alive=GS.enemies.filter(e=>!e.dead);
  
  if(GS.stagePhase===0 && alive.length===0 && GS.enemies.length>0) {
    GS.stagePhase=1; GS.enemies=[]; spawnInterceptors();
  } else if(GS.stagePhase===1 && alive.length===0 && GS.enemies.length>0) {
    GS.stagePhase=2; GS.enemies=[]; spawnCruisers();
  } else if(GS.stagePhase===2 && alive.length===0 && GS.enemies.length>0) {
    GS.stagePhase=3; GS.enemies=[]; spawnBoss();
  }
}

function spawnExplosionAt(x,y,color,count) {
  for(let i=0;i<count;i++){
    const ang=(Math.PI*2/count)*i+Math.random()*0.4;
    const spd=1.5+Math.random()*3;
    GS.particles.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:1,r:3+Math.random()*4,color});
  }
  // Ring shockwave (draw as large fade circle via float)
  GS.floats.push({x,y,ring:true,r:5,maxR:40,color,life:0.5,grow:true});
}
function spawnHitSpark(x,y) {
  for(let i=0;i<4;i++){
    const ang=Math.random()*Math.PI*2, spd=2+Math.random()*3;
    GS.particles.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:0.4,r:2,color:'#ffffff'});
  }
}

function gameOver() {
  GS.state='gameover';
  updateHiScore();
}

// ══ DRAWING ══
function draw() {
  ctx.fillStyle='#000005';
  ctx.fillRect(0,0,W,H);
  
  // Flash
  if(GS.flashTimer>0){
    ctx.fillStyle=`rgba(255,255,255,${GS.flashTimer*0.8})`;
    ctx.fillRect(0,0,W,H);
  }
  
  drawNebulae();
  drawPlanets();
  drawStars();
  
  if(GS.state==='title') { drawTitle(); return; }
  if(GS.state==='countdown') { drawGame(); drawCountdown(); return; }
  if(GS.state==='gameover') { drawGame(); drawGameOver(); return; }
  if(GS.state==='stagecomplete'||GS.state==='bossdefeated') { drawGame(); drawStageClear(); return; }
  
  drawGame();
}

function drawNebulae() {
  NEBULAE.forEach(n=>{
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
    g.addColorStop(0,n.c1); g.addColorStop(1,n.c2);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill();
  });
}
function drawPlanets() {
  PLANETS.forEach((pl,i)=>{
    const y=pl.y+planetY[i];
    // Shadow
    ctx.fillStyle='#00000055';
    ctx.beginPath(); ctx.ellipse(pl.x+pl.r*0.3,y+pl.r*0.1,pl.r*0.8,pl.r*0.3,0,0,Math.PI*2); ctx.fill();
    // Planet
    const g=ctx.createRadialGradient(pl.x-pl.r*0.3,y-pl.r*0.3,0,pl.x,y,pl.r);
    g.addColorStop(0,'#ffffff33'); g.addColorStop(0.5,pl.color); g.addColorStop(1,'#00000088');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(pl.x,y,pl.r,0,Math.PI*2); ctx.fill();
    if(pl.ring){
      ctx.strokeStyle=pl.color+'88'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.ellipse(pl.x,y,pl.r*1.8,pl.r*0.4,0.3,0,Math.PI*2); ctx.stroke();
    }
  });
}
function drawStars() {
  STARS.forEach(s=>{
    ctx.globalAlpha=s.alpha;
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawGame() {
  drawEngineParticles();
  drawBoss();
  drawEnemiesVisual();
  drawPowerupsVisual();
  drawBullets();
  drawEnemyBullets();
  drawParticlesVisual();
  drawPlayer();
  drawHUD();
}

function drawPlayer() {
  const p=GS.player;
  if(p.dead) return;
  if(p.invincible>0 && Math.floor(p.invincible*10)%2===0) return; // Blink
  
  ctx.save(); ctx.translate(p.x,p.y);
  
  // Engine glow
  ctx.fillStyle='#0066ff33';
  ctx.beginPath(); ctx.ellipse(0,25,15,8,0,0,Math.PI*2); ctx.fill();
  
  // Ship body
  ctx.fillStyle='#1a2a4a';
  ctx.beginPath();
  ctx.moveTo(0,-28); ctx.lineTo(-18,16); ctx.lineTo(-10,10); ctx.lineTo(0,16);
  ctx.lineTo(10,10); ctx.lineTo(18,16); ctx.closePath(); ctx.fill();
  
  // Ship highlight
  ctx.fillStyle='#2244aa';
  ctx.beginPath();
  ctx.moveTo(0,-24); ctx.lineTo(-6,0); ctx.lineTo(0,8); ctx.lineTo(6,0); ctx.closePath(); ctx.fill();
  
  // Wing details
  ctx.strokeStyle='#4466cc'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(-16,14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(16,14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4,-8); ctx.lineTo(-12,10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4,-8); ctx.lineTo(12,10); ctx.stroke();
  
  // Cockpit
  ctx.fillStyle='#44aaff88';
  ctx.beginPath(); ctx.ellipse(0,-12,5,8,0,0,Math.PI*2); ctx.fill();
  
  // Charge indicator
  if(GS.chargeActive && GS.chargeLevel>0){
    ctx.strokeStyle=`rgba(255,100,255,${GS.chargeLevel})`;
    ctx.lineWidth=2+GS.chargeLevel*4;
    ctx.shadowColor='#ff88ff'; ctx.shadowBlur=20*GS.chargeLevel;
    ctx.beginPath(); ctx.arc(0,0,20+GS.chargeLevel*10,0,Math.PI*2); ctx.stroke();
    ctx.shadowBlur=0;
  }
  
  // Shield bubble
  if(GS.shieldActive){
    ctx.strokeStyle='#44ff8888'; ctx.lineWidth=2;
    ctx.shadowColor='#44ff88'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(0,0,30,0,Math.PI*2); ctx.stroke();
    ctx.shadowBlur=0;
  }
  
  ctx.restore();
}

function drawEngineParticles() {
  GS.engineParticles.forEach(p=>{
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawBullets() {
  GS.bullets.forEach(b=>{
    if(b.charge){
      const r=b.r+Math.sin(b.pulse||0)*4;
      ctx.shadowColor=b.color; ctx.shadowBlur=20;
      ctx.fillStyle=b.color;
      ctx.beginPath(); ctx.arc(b.x,b.y,r,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#ffffff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(b.x,b.y,r*0.6,0,Math.PI*2); ctx.stroke();
      ctx.shadowBlur=0;
    } else {
      ctx.shadowColor=b.color; ctx.shadowBlur=8;
      ctx.fillStyle=b.color;
      ctx.fillRect(b.x-b.r,b.y-10,b.r*2,20);
      // Glow tip
      ctx.fillStyle='#ffffff';
      ctx.fillRect(b.x-1,b.y-12,2,6);
      ctx.shadowBlur=0;
    }
  });
}

function drawEnemyBullets() {
  GS.enemyBullets.forEach(b=>{
    ctx.shadowColor=b.color; ctx.shadowBlur=10;
    ctx.fillStyle=b.color;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    if(b.homing){
      ctx.strokeStyle='#ffaa00'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r+4,0,Math.PI*2); ctx.stroke();
    }
    ctx.shadowBlur=0;
  });
}

function drawEnemiesVisual() {
  GS.enemies.forEach(e=>{
    if(e.dead) return;
    ctx.save(); ctx.translate(e.x,e.y);
    
    if(e.type==='scout'){
      // Red inverted-V
      ctx.fillStyle='#cc2222';
      ctx.beginPath();
      ctx.moveTo(0,10); ctx.lineTo(-16,-12); ctx.lineTo(-6,-6);
      ctx.lineTo(0,2); ctx.lineTo(6,-6); ctx.lineTo(16,-12);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#ff4444'; ctx.lineWidth=1.5; ctx.stroke();
      // Engine
      ctx.fillStyle='#ff880088';
      ctx.beginPath(); ctx.ellipse(0,12,6,4,0,0,Math.PI*2); ctx.fill();
    } else if(e.type==='interceptor'){
      // Orange hexagon
      ctx.fillStyle='#cc5500';
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a=i*Math.PI/3-Math.PI/6;
        i===0?ctx.moveTo(Math.cos(a)*18,Math.sin(a)*18):ctx.lineTo(Math.cos(a)*18,Math.sin(a)*18);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#ff8800'; ctx.lineWidth=2; ctx.stroke();
      // HP mini bar
      const bw=36,bh=4;
      ctx.fillStyle='#333'; ctx.fillRect(-bw/2,-28,bw,bh);
      ctx.fillStyle='#ff6600'; ctx.fillRect(-bw/2,-28,bw*(e.hp/e.maxHp),bh);
    } else if(e.type==='cruiser'){
      // Purple rectangle with antennae
      ctx.fillStyle='#550088';
      ctx.fillRect(-30,-20,60,40);
      ctx.fillStyle='#8800cc';
      ctx.fillRect(-24,-16,48,32);
      ctx.strokeStyle='#cc44ff'; ctx.lineWidth=2;
      ctx.strokeRect(-30,-20,60,40);
      // Antennae
      ctx.strokeStyle='#cc44ff'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(-15,-20); ctx.lineTo(-15,-35); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(15,-20); ctx.lineTo(15,-35); ctx.stroke();
      ctx.fillStyle='#ff88ff';
      ctx.beginPath(); ctx.arc(-15,-37,3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(15,-37,3,0,Math.PI*2); ctx.fill();
      // HP bar
      const bw=60,bh=5;
      ctx.fillStyle='#333'; ctx.fillRect(-bw/2,-30,bw,bh);
      ctx.fillStyle='#cc44ff'; ctx.fillRect(-bw/2,-30,bw*(e.hp/e.maxHp),bh);
    }
    ctx.restore();
  });
}

function drawBoss() {
  const boss=GS.boss;
  if(!boss||boss.dead) return;
  
  ctx.save(); ctx.translate(boss.x,boss.y);
  
  // Body
  const phase=boss.phase;
  ctx.fillStyle=phase===3?'#550000':phase===2?'#330066':'#220044';
  ctx.beginPath();
  ctx.moveTo(0,-70); ctx.lineTo(80,-30); ctx.lineTo(100,20);
  ctx.lineTo(60,50); ctx.lineTo(0,60); ctx.lineTo(-60,50);
  ctx.lineTo(-100,20); ctx.lineTo(-80,-30); ctx.closePath(); ctx.fill();
  
  ctx.strokeStyle=phase===3?'#ff4444':phase===2?'#aa44ff':'#8800cc';
  ctx.lineWidth=3; ctx.stroke();
  
  // Core
  ctx.fillStyle=phase===3?'#ff0000':phase===2?'#aa00ff':'#6c00ff';
  ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=30;
  ctx.beginPath(); ctx.arc(0,0,30+Math.sin(GS.frameCount*0.08)*5,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  
  // Cannons
  [[-60,20],[60,20],[-30,-30],[30,-30]].forEach(([bx,by])=>{
    ctx.fillStyle='#444'; ctx.beginPath(); ctx.arc(bx,by,10,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#888'; ctx.lineWidth=2; ctx.stroke();
  });
  
  // Laser sweep (phase 3)
  if(boss.phase>=3 && boss.laserActive){
    const ang=Math.PI/2+boss.laserAngle;
    ctx.strokeStyle='#ff000088'; ctx.lineWidth=6;
    ctx.shadowColor='#ff0000'; ctx.shadowBlur=20;
    ctx.beginPath(); ctx.moveTo(0,30);
    ctx.lineTo(Math.cos(ang)*1000,30+Math.sin(ang)*1000);
    ctx.stroke();
    ctx.shadowBlur=0;
  }
  
  ctx.restore();
  
  // Boss HP bar across top
  const bw=W-40, bh=14;
  ctx.fillStyle='#111'; ctx.fillRect(20,8,bw,bh);
  const pct=Math.max(0,boss.hp/boss.maxHp);
  const barColor=pct>0.6?'#cc44ff':pct>0.3?'#ff8800':'#ff2222';
  ctx.fillStyle=barColor; ctx.fillRect(20,8,bw*pct,bh);
  ctx.strokeStyle='#6c00ff'; ctx.lineWidth=1.5; ctx.strokeRect(20,8,bw,bh);
  ctx.fillStyle='#fff'; ctx.font='bold 10px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(`BOSS  ${Math.ceil(boss.hp)} / ${boss.maxHp}  [Phase ${boss.phase}]`, W/2, 15);
}

function drawPowerupsVisual() {
  GS.powerups.forEach(pu=>{
    if(pu.collected) return;
    ctx.save(); ctx.translate(pu.x,pu.y);
    ctx.rotate(pu.angle||0);
    // Glow circle
    ctx.fillStyle=pu.color+'33';
    ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=pu.color; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2); ctx.stroke();
    ctx.font='16px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(pu.icon,0,0);
    ctx.restore();
  });
}

function drawParticlesVisual() {
  GS.particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0.1,p.r),0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
  
  // Ring shockwaves and float texts
  GS.floats.forEach(f=>{
    if(f.ring){
      const r=f.grow?f.maxR*(1-f.life*2):f.r;
      ctx.globalAlpha=Math.max(0,f.life);
      ctx.strokeStyle=f.color; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(f.x,f.y,Math.max(1,r),0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=1;
      f.r+=3;
    } else {
      ctx.globalAlpha=Math.min(1,f.life);
      ctx.fillStyle=f.color||'#ffd700';
      ctx.font=`bold 13px Arial`; ctx.textAlign='center';
      ctx.fillText(f.text,f.x,f.y);
      ctx.globalAlpha=1;
    }
  });
}

function drawHUD() {
  // Score
  ctx.fillStyle='#e8e8f0'; ctx.font='bold 14px Arial'; ctx.textAlign='left';
  ctx.fillText(`Score: ${GS.score}`, 10, 32);
  if(GS.multiplier>1){
    ctx.fillStyle='#ffd700';
    ctx.fillText(`×${GS.multiplier}`, 10, 50);
  }
  // Hi-score
  ctx.fillStyle='#6c00ff'; ctx.textAlign='right';
  ctx.fillText(`HI: ${GS.hiScore}`, W-10, 32);
  
  // Lives
  ctx.textAlign='left'; ctx.font='18px Arial';
  for(let i=0;i<GS.lives;i++){
    // Ship icon
    ctx.fillStyle='#2244aa';
    ctx.save(); ctx.translate(10+i*28,H-25);
    ctx.scale(0.6,0.6);
    ctx.beginPath(); ctx.moveTo(0,-15); ctx.lineTo(-10,10); ctx.lineTo(10,10); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  
  // Power-up timers
  let puX=10, puY=H-55;
  if(GS.shotType!=='single'&&GS.shotTimer>0){
    ctx.fillStyle=GS.shotType==='double'?'#4488ff':'#ffee00';
    ctx.font='11px Arial'; ctx.textAlign='left';
    ctx.fillText(`${GS.shotType==='double'?'⚡Double':'⭐Triple'} ${GS.shotTimer.toFixed(0)}s`,puX,puY);
    puX+=110;
  }
  if(GS.shieldActive){
    ctx.fillStyle='#44ff88'; ctx.font='11px Arial';
    ctx.fillText('🛡 Shield',puX,puY);
    puX+=70;
  }
  if(GS.speedBoost&&GS.speedTimer>0){
    ctx.fillStyle='#00ffff'; ctx.font='11px Arial';
    ctx.fillText(`💫Speed ${GS.speedTimer.toFixed(0)}s`,puX,puY);
  }
  
  // Stage
  ctx.fillStyle='#6c00ff'; ctx.font='bold 12px Arial'; ctx.textAlign='right';
  const pNames=['Scouts','Interceptors','Cruisers','BOSS'];
  ctx.fillText(`Stage ${GS.stage} · ${pNames[Math.min(GS.stagePhase,3)]}`,W-10,H-10);
}

function drawTitle() {
  // Animated ships in background
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
  ctx.restore();
  
  // Title glow
  ctx.shadowColor='#6c00ff'; ctx.shadowBlur=30;
  ctx.fillStyle='#6c00ff';
  ctx.font='bold 52px Arial'; ctx.textAlign='center';
  ctx.fillText('GALAXY',W/2,200);
  ctx.fillStyle='#00b4ff';
  ctx.font='bold 52px Arial';
  ctx.fillText('ATTACK',W/2,260);
  ctx.shadowBlur=0;
  
  ctx.fillStyle='#e8e8f0';
  ctx.font='14px Arial';
  ctx.fillText('Arrow Keys / A-D to move',W/2,330);
  ctx.fillText('Auto-fire • Hold SPACE for charge shot',W/2,355);
  ctx.fillText('Defeat all enemies to advance',W/2,380);
  
  ctx.fillStyle=Math.sin(Date.now()*0.004)>0?'#ffd700':'#ffaa00';
  ctx.font='bold 16px Arial';
  ctx.fillText('▶  PRESS SPACE TO START',W/2,440);
  
  if(GS.hiScore>0){
    ctx.fillStyle='#6c00ff'; ctx.font='13px Arial';
    ctx.fillText(`Hi-Score: ${GS.hiScore}`,W/2,480);
  }
  
  // Decorative ships
  drawTitleShip(100,500,1);
  drawTitleShip(380,540,0.8);
}

function drawTitleShip(x,y,s) {
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle='#1a3a6a';
  ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(-14,12); ctx.lineTo(14,12); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#2244aa';
  ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(-5,4); ctx.lineTo(5,4); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawCountdown() {
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
  const t=Math.ceil(GS.countdownTimer);
  ctx.shadowColor='#ffd700'; ctx.shadowBlur=30;
  ctx.fillStyle='#ffd700';
  ctx.font=`bold ${80+Math.sin(GS.countdownTimer*5)*5}px Arial`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(t>0?t:'GO!',W/2,H/2);
  ctx.shadowBlur=0;
  ctx.font='bold 20px Arial'; ctx.fillStyle='#e8e8f0';
  ctx.fillText(`MISSION ${GS.stage}`,W/2,H/2-80);
}

function drawStageClear() {
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
  ctx.shadowColor='#ffd700'; ctx.shadowBlur=20;
  ctx.fillStyle='#ffd700'; ctx.font='bold 36px Arial'; ctx.textAlign='center';
  ctx.fillText('STAGE CLEAR!',W/2,H/2-60);
  ctx.fillStyle='#e8e8f0'; ctx.font='20px Arial'; ctx.shadowBlur=0;
  ctx.fillText(`Score: ${GS.score}`,W/2,H/2);
  ctx.fillStyle='#6c00ff'; ctx.font='14px Arial';
  ctx.fillText('Press ENTER to continue',W/2,H/2+60);
}

function drawGameOver() {
  ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,0,W,H);
  ctx.shadowColor='#ff4444'; ctx.shadowBlur=20;
  ctx.fillStyle='#ff4444'; ctx.font='bold 42px Arial'; ctx.textAlign='center';
  ctx.fillText('GAME OVER',W/2,H/2-60);
  ctx.shadowBlur=0;
  ctx.fillStyle='#e8e8f0'; ctx.font='16px Arial';
  ctx.fillText(`Score: ${GS.score}`,W/2,H/2);
  ctx.fillText(`Hi-Score: ${GS.hiScore}`,W/2,H/2+30);
  ctx.fillStyle=Math.sin(Date.now()*0.004)>0?'#ffd700':'#ffaa00';
  ctx.font='bold 15px Arial';
  ctx.fillText('Press ENTER to retry',W/2,H/2+80);
}

// ══ START ══
initGame();
requestAnimationFrame(loop);
</script>
