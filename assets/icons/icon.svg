<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#14141f"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c00ff"/>
      <stop offset="100%" style="stop-color:#00b4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#bolt)" stroke-width="4" opacity="0.4"/>
  <!-- Lightning bolt ⚡ -->
  <path d="M290 80 L170 280 H240 L215 440 L350 230 H278 Z"
        fill="url(#bolt)" filter="url(#glow)"/>
  <!-- GAMING text -->
  <text x="256" y="490" font-family="'Segoe UI', Arial, sans-serif" font-size="48"
        font-weight="900" text-anchor="middle" letter-spacing="6"
        fill="#00b4ff" opacity="0.7">GAMING</text>
</svg>
