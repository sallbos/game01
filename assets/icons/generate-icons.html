<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="c"></canvas>
<script>
// Generates PNG icons at multiple sizes from an inline SVG
const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#14141f"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c00ff"/>
      <stop offset="100%" style="stop-color:#00b4ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#bolt)" stroke-width="4" opacity="0.4"/>
  <path d="M290 80 L170 280 H240 L215 440 L350 230 H278 Z" fill="url(#bolt)"/>
  <text x="256" y="490" font-family="Arial,sans-serif" font-size="48" font-weight="900" text-anchor="middle" letter-spacing="6" fill="#00b4ff" opacity="0.7">GAMING</text>
</svg>`;

const blob = new Blob([svgStr], {type: 'image/svg+xml'});
const url = URL.createObjectURL(blob);
const img = new Image();
img.onload = function() {
  const links = [];
  sizes.forEach(s => {
    const canvas = document.createElement('canvas');
    canvas.width = s; canvas.height = s;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, s, s);
    const a = document.createElement('a');
    a.download = `icon-${s}.png`;
    a.href = canvas.toDataURL('image/png');
    a.textContent = `Download icon-${s}.png`;
    a.style.display = 'block';
    document.body.appendChild(a);
  });
  URL.revokeObjectURL(url);
};
img.src = url;
</script>
</body>
</html>
